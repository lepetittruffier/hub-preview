<svg viewBox="60 70 520 520" width="640" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cross-hatch etching study of a sphere. Tone is built only from line density: four hatch layers at 0, 45, 90 and 135 degrees switch on progressively as the surface darkens — none in the highlight, all four in the core shadow. Straight 0.5px chords clipped to the disc, no fills, no gradients.">
